<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="./css/index.css">
    <title>Calculator</title>
</head>
<body>
    
   <div class="wrapper-calculator">
        <div class="calculator-monitor">
            <input type="text" class="calculator-monitor__inputExpression" placeholder="Input expression" readonly>
        </div>
        <div class="calculator-function">

            <div class="calculator-function__btnsOperands">
                <div class="calculator-function__btnsOperands-block">
                    
                    <button class="btn-operand">1</button>
                    <button class="btn-operand">2</button>
                    <button class="btn-operand">3</button>

                </div>
                
                <div class="calculator-function__btnsOperands-block">
                    <button class="btn-operand">4</button>
                    <button class="btn-operand">5</button>
                    <button class="btn-operand">6</button>

                </div>

                <div class="calculator-function__btnsOperands-block">

                    <button class="btn-operand">7</button>
                    <button class="btn-operand">8</button>
                    <button class="btn-operand">9</button>
                </div>

                <div class="calculator-function__btnsOperands-block">
                    <button class="btn-operand">.</button>
                    <button class="btn-operand">0</button>
                    <button class="btn-operand btn-operand-icon">
                        <span class="material-symbols-outlined icon-backspace">backspace</span>
                    </button>     

                </div>
       
            </div>

            <div class="calculator-function__btnsOperators">
                <div class="calculator__btnsOperators-block">
                    <button class="btn-operator">+</button>    
                    <button class="btn-operator">-</button>
                    
                </div>

                 <div class="calculator__btnsOperators-block">
                    <button class="btn-operator">*</button>    
                    <button class="btn-operator">/</button>
                    
                </div>

                 <div class="calculator__btnsOperators-block">
                    <button class="btn-operator">%</button>    
                    <button class="btn-operator">^</button>
                    
                </div>

                 <div class="calculator__btnsOperators-block">
                    <button class=" btn-equal">=</button>    
                    
                </div>

            </div>
        </div>
   </div>
   <script type="module" src="./scripts/calcalator.js"></script>
   <script type="module" src="./scripts/handle_inputExpression.js"></script>

   <script type="module" src="./scripts/index.js"></script>
       
   <script type="module">
        import { main } from './scripts/index.js';

        main('wrapper-calculator');

        
      
   </script>
</body>
</html>
