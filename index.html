<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="./css/index.css">
    <title>Calculator</title>
</head>
<body>
    
   <div class="wrapper-calculator">
        <div class="calculator-monitor">
            <input type="text" class="calculator-monitor__inputExpression" placeholder="Input expression">
        </div>
        <div class="calculator-function">

            <div class="calculator-function__btnsNumbers">
                <div class="calculator-function__btnsNumbers-block">
                    
                    <button class="btn-number">1</button>
                    <button class="btn-number">2</button>
                    <button class="btn-number">3</button>

                </div>
                
                <div class="calculator-function__btnsNumbers-block">
                    <button class="btn-number">4</button>
                    <button class="btn-number">5</button>
                    <button class="btn-number">6</button>

                </div>

                <div class="calculator-function__btnsNumbers-block">

                    <button class="btn-number">7</button>
                    <button class="btn-number">8</button>
                    <button class="btn-number">9</button>
                </div>

                <div class="calculator-function__btnsNumbers-block">
                    <button class="btn-number">.</button>
                    <button class="btn-number">0</button>
                    <button class="btn-number">
                        <span class="material-symbols-outlined btn-number-icon">backspace</span>
                    </button>     

                </div>
       
            </div>

            <div class="calculator-function__btnsOperators">
                <div class="calculator__btnsOperators-block">
                    <button class="btn__operator">+</button>    
                    <button class="btn__operator">-</button>
                    
                </div>

                 <div class="calculator__btnsOperators-block">
                    <button class="btn__operator">*</button>    
                    <button class="btn__operator">/</button>
                    
                </div>

                 <div class="calculator__btnsOperators-block">
                    <button class="btn__operator">%</button>    
                    <button class="btn__operator">^</button>
                    
                </div>

                 <div class="calculator__btnsOperators-block">
                    <button class=" btn-equal">=</button>    
                    
                </div>

            </div>
        </div>
   </div>
   <script type="module" src="./scripts/calcalator.js"></script>
   <script type="module" src="./scripts/handle_inputExpression.js"></script>

   <script type="module" src="./scripts/index.js"></script>
       
   <script type="module">
        import { main } from './scripts/index.js';

        main('wrapper-calculator');
      
   </script>
</body>
</html>
