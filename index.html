<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="./css/index.css">
    <title>Calculator</title>
</head>
<body>
    
   <div class="wrapper-calculator">
        <div class="calculator-monitor">
            <input type="text" class="calculator-monitor__inputExpression" placeholder="Input expression">
        </div>
        <div class="calculator-function">

            <div class="calculator-function__btnsNumbers">

                <div class="calculator-function__btnsNumbers-block">

                    <button class="btn__number">1</button>
                    <button class="btn__number">2</button>
                    <button class="btn__number">3</button>

                </div>

                <div class="calculator-function__btnsNumbers-block">

                    <button class="btn__number">4</button>
                    <button class="btn__number">5</button>
                    <button class="btn__number">6</button>

                </div>

                 <div class="calculator-function__btnsNumbers-block">

                    <button class="btn__number">7</button>
                    <button class="btn__number">8</button>
                    <button class="btn__number">9</button>

                </div>

                 <div class="calculator-function__btnsNumbers-block">

                    <button class="btn__number">.</button>
                    <button class="btn__number">0</button>
                    <button class="btn__number">
                        <span class="material-symbols-outlined">backspace</span>
                    </button>

                </div>

            </div>
            <div class="calculator-function__btnsOperators">

            </div>
        </div>
   </div>

   <script src="./scripts/index.js"></script>
</body>
</html>
